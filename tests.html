<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Tamyr — тесты движка</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <main>
    <section class="card">
      <h1>Тесты движка диагностики</h1>
      <p class="muted">Юнит-тесты графа и алгоритма + симуляция 1000 виртуальных учеников с заранее известными пробелами.</p>
      <ul class="tests" id="tests"></ul>
    </section>
    <section class="card">
      <h2>Симуляция: точность поиска корневых пробелов</h2>
      <div id="sim"></div>
    </section>
  </main>
  <script src="js/data.js"></script>
  <script src="js/engine.js"></script>
  <script>
    const T = window.Tamyr;
    const out = document.getElementById('tests');
    const results = [];
    function test(name, fn) {
      let ok = false, err = '';
      try { fn(); ok = true; } catch (e) { err = e.message; }
      results.push({ name, ok, err });
      out.insertAdjacentHTML('beforeend', `<li class="${ok ? 'pass' : 'fail'}">${ok ? '✓' : '✗'} ${name}${err ? ' — ' + err : ''}</li>`);
    }
    function assert(c, m) { if (!c) throw new Error(m || 'assertion failed'); }
    function eq(a, b, m) { if (JSON.stringify(a) !== JSON.stringify(b)) throw new Error((m || '') + ` ожидалось ${JSON.stringify(b)}, получено ${JSON.stringify(a)}`); }

    // Скриптовый ученик: знает темы из known, остальные — нет (отвечает детерминированно).
    function run(start, known, opts) {
      const d = new T.Diagnostic(start, { rand: T.rng(7) });
      let cur, n = 0;
      while ((cur = d.next())) {
        const ok = known.has(cur.topic);
        const idx = ok ? cur.options.findIndex(o => o.ok)
          : (opts && opts.skip) ? null
          : cur.options.findIndex(o => !o.ok && o.mis) !== -1 ? cur.options.findIndex(o => !o.ok && o.mis) : cur.options.findIndex(o => !o.ok);
        d.answer(idx);
        if (++n > 200) throw new Error('бесконечный цикл');
      }
      return { d, r: d.result() };
    }
    const ALL = new Set(T.TOPICS.map(t => t.id));
    const without = (...ids) => {
      const s = new Set(ALL);
      ids.forEach(id => { s.delete(id); T.descendants(id).forEach(x => s.delete(x)); });
      return s;
    };

    test('Граф: у каждой темы есть минимум 3 вопроса', () => T.TOPICS.forEach(t => assert(T.questionsByTopic[t.id].length >= 3, t.id)));
    test('Граф: у каждого вопроса ровно один верный ответ', () => T.QUESTIONS.forEach(q => eq(q.options.filter(o => o.ok).length, 1, q.id)));
    test('Граф: все пререквизиты существуют и лежат на более низком уровне', () => T.TOPICS.forEach(t => t.prereq.forEach(p => {
      assert(T.TOPIC[p], p); assert(T.TOPIC[p].level < t.level, t.id + '→' + p);
    })));
    test('Граф: все метки ошибок существуют', () => T.QUESTIONS.forEach(q => q.options.forEach(o => { if (o.mis) assert(T.MISCONCEPTIONS[o.mis], o.mis); })));
    test('Граф: домашняя тема каждой ошибки существует', () => Object.values(T.MISCONCEPTIONS).forEach(m => assert(T.TOPIC[m.home], m.home)));

    test('Сильный ученик: 2 вопроса на цель, всё остальное выводится', () => {
      const { r } = run(['quad'], ALL);
      eq(r.asked, 2); eq(r.gaps, []); eq(r.status.quad, 'mastered'); eq(r.status.frac, 'inferred');
    });
    test('Пробел в дробях находится как единственный корень', () => {
      const { r } = run(['quad'], without('frac'));
      eq(r.rootGaps, ['frac']);
    });
    test('Пробел в отрицательных числах находится с цели «вся алгебра»', () => {
      const { r } = run(T.GOALS[0].start, without('neg'));
      eq(r.rootGaps, ['neg']);
    });
    test('Два независимых корня находятся оба', () => {
      const { r } = run(T.GOALS[0].start, without('frac', 'pow'));
      eq(r.rootGaps.slice().sort(), ['frac', 'pow']);
    });
    test('«Не знаю» считается неверным ответом', () => {
      const { r } = run(['lin'], new Set(), { skip: true });
      assert(r.gaps.includes('lin')); assert(r.rootGaps.length > 0);
    });
    test('Не больше 3 вопросов на тему', () => {
      const { d } = run(T.GOALS[0].start, without('arith'));
      T.TOPICS.forEach(t => assert(d.state[t.id].answers.length <= 3, t.id));
    });
    test('Непроверенные темы над корнем помечаются «под угрозой», а не «освоено»', () => {
      // цель — квадратные уравнения, корень — дроби; проценты и парабола не проверялись, но стоят на дробях
      const { d, r } = run(['quad'], without('frac'));
      eq(r.rootGaps, ['frac']);
      ['pct', 'prop', 'word', 'parab'].forEach(id => {
        assert(!d.state[id].tested, id + ' не должна проверяться');
        eq(r.status[id], 'risk', id + ':');
      });
    });
    test('Ошибка с меткой: её домашняя тема проверяется раньше остальных пререквизитов', () => {
      // quad1, вариант «x = 4,5» → ошибка root_as_half, домашняя тема «Корни».
      // Без метки первым проверялся бы первый пререквизит — «Разложение».
      const d = new T.Diagnostic(['quad'], { rand: T.rng(1) });
      eq(T.TOPIC.quad.prereq[0], 'fact');
      const q1 = T.QUESTION.quad1;
      d.current = { topic: 'quad', question: q1, options: q1.options, reason: { kind: 'goal' } };
      d.answer(q1.options.findIndex(o => o.mis === 'root_as_half'));
      const cur = d.next();
      assert(cur.topic === 'quad' && cur.question.id !== 'quad1', 'второй вопрос — снова по теме «Кв. уравнения»');
      d.answer(cur.options.findIndex(o => !o.ok && !o.mis));
      eq(d.state.quad.status, 'gap');
      eq(d.next().topic, 'root');
      eq(d.current.reason.kind, 'mis');
    });
    test('Без метки ошибки пререквизиты проверяются по порядку', () => {
      const d = new T.Diagnostic(['quad'], { rand: T.rng(1) });
      for (let k = 0; k < 2; k++) { const cur = d.next(); d.answer(cur.options.findIndex(o => !o.ok && !o.mis)); }
      eq(d.state.quad.status, 'gap');
      eq(d.next().topic, 'fact');
    });
    test('Банк: 6 вопросов на каждую тему, id уникальны, варианты в вопросе не повторяются', () => {
      T.TOPICS.forEach(t => eq(T.questionsByTopic[t.id].length, 6, t.id + ':'));
      eq(new Set(T.QUESTIONS.map(q => q.id)).size, T.QUESTIONS.length, 'id:');
      T.QUESTIONS.forEach(q => eq(new Set(q.options.map(o => o.t)).size, q.options.length, q.id + ':'));
    });
    test('Практика начинается с заданий, которых не было в диагностике', () => {
      for (let seed = 1; seed <= 50; seed++) {
        const { d } = run(['quad'], without('frac'));
        T.TOPICS.forEach(t => {
          const used = d.state[t.id].answers.map(a => a.qid);
          const queue = T.practiceQueue(t.id, used, T.rng(seed));
          eq(queue.length, 6);
          queue.slice(0, 3).forEach(q => assert(!used.includes(q.id), t.id + ': ' + q.id + ' уже был'));
        });
      }
    });

    // ---- Симуляция ----
    const BASE = ['arith', 'neg', 'frac', 'pow', 'pct', 'prop', 'expr', 'root', 'lin', 'fsu'];
    // Набор «настройка» (seed 42) использовался при доработке движка.
    // Набор «контроль» (seed 777) при доработке не использовался — его цифры и надо называть.
    function simulate(genSeed, runSeedBase, N, p) {
      const rand = T.rng(genSeed);
      let exact = 0, tp = 0, fp = 0, fn = 0;
      const askedBy = { 0: [], 1: [], 2: [] };
      for (let i = 0; i < N; i++) {
        const k = rand() < 0.15 ? 0 : rand() < 0.7 ? 1 : 2;
        const roots = [];
        while (roots.length < k) { const r = BASE[Math.floor(rand() * BASE.length)]; if (!roots.includes(r)) roots.push(r); }
        // оставляем только независимые корни (один не является предком другого)
        const truth = roots.filter(r => !roots.some(o => o !== r && T.ancestors(r).has(o)));
        const res = T.runSimulated(T.GOALS[0].start, truth, runSeedBase + i, p);
        askedBy[truth.length].push(res.asked);
        const got = new Set(res.rootGaps);
        truth.forEach(r => got.has(r) ? tp++ : fn++);
        got.forEach(r => { if (!truth.includes(r)) fp++; });
        if (truth.length === got.size && truth.every(r => got.has(r))) exact++;
      }
      const avg = a => a.length ? a.reduce((s, x) => s + x, 0) / a.length : 0;
      const all = [].concat(askedBy[0], askedBy[1], askedBy[2]);
      return { N, recall: tp / (tp + fn), precision: tp / (tp + fp), exact: exact / N, avgAsked: avg(all), asked0: avg(askedBy[0]), asked1: avg(askedBy[1]), asked2: avg(askedBy[2]) };
    }
    const pct = x => (100 * x).toFixed(1) + '%';
    const full = T.TOPICS.reduce((s, t) => s + Math.min(3, T.questionsByTopic[t.id].length), 0);
    window.SIM = {
      tuning: simulate(42, 5000, 1000),
      holdout: simulate(777, 70000, 1000),
      holdoutGuess25: simulate(777, 70000, 1000, { unknown: 0.25 }),
      holdoutNoisy: simulate(777, 70000, 1000, { known: 0.85 }),
      holdoutIdeal: simulate(777, 70000, 1000, { known: 1, unknown: 0 }),
      full
    };
    const rows = [['Настройка (использовался при доработке)', SIM.tuning], ['<b>Контроль</b> (новые ученики)', SIM.holdout],
      ['Контроль: угадывание 25%', SIM.holdoutGuess25], ['Контроль: 85% верно в знакомых темах', SIM.holdoutNoisy], ['Контроль: без шума', SIM.holdoutIdeal]];
    document.getElementById('sim').innerHTML = `
      <div class="heat-wrap"><table class="simtable">
        <thead><tr><th>Набор</th><th>Полнота</th><th>Точность</th><th>Совпало полностью</th><th>Вопросов: без пробелов / 1 корень / 2 корня</th></tr></thead>
        <tbody>${rows.map(([n, s]) => `<tr><td>${n}</td><td>${pct(s.recall)}</td><td>${pct(s.precision)}</td><td>${pct(s.exact)}</td><td>${s.asked0.toFixed(1)} / ${s.asked1.toFixed(1)} / ${s.asked2.toFixed(1)}</td></tr>`).join('')}</tbody>
      </table></div>
      <p class="small muted" style="margin-top:12px">По 1000 виртуальных учеников в каждом наборе. Модель ученика: знает тему → верно с вероятностью 92%; не знает → 20% (угадывание), в остальных случаях в 70% выбирает «типичную» ошибку. Это проверка алгоритма, а не данные реальных учеников. Для сравнения: 3 вопроса по каждой из 17 тем — ${full} вопросов.</p>`;
    window.TEST_RESULTS = results;
  </script>
</body>
</html>
